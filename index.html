<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button GAME コントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 { font-size: 1.2rem; margin-bottom: 5px; color: #ff9800; }
        #status { font-size: 0.9rem; margin-bottom: 15px; padding: 8px; border-radius: 4px; background-color: #333; }
        .connected { background-color: #2e7d32 !important; }
        .disconnected { background-color: #c62828 !important; }
        
        .view { display: none; }
        .view.active { display: block; }

        #gameView {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #dynamicDisplay {
            background-color: #263238;
            border: 2px solid #546e7a;
            border-radius: 12px;
            padding: 25px 10px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #bigMainText {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffeb3b;
            margin: 0;
        }
        #subText {
            font-size: 1.1rem;
            color: #b0bec5;
            margin-top: 10px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .score-card {
            background: #37474f;
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1rem;
            word-break: break-all;
        }
        .score-card span {
            font-size: 1.4rem;
            font-weight: bold;
            color: #4caf50;
            display: block;
            margin-top: 5px;
        }

        #liveAlertBox {
            background-color: #b71c1c;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .section {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
        }
        h2 { font-size: 1rem; margin-top: 0; color: #bbdefb; text-align: center; }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:active { opacity: 0.7; }
        #connectBtn { background-color: #2196f3; color: white; font-size: 1.1rem; margin-bottom: 15px; }
        .mode-btn { background-color: #37474f; color: white; text-align: left; padding-left: 20px; }
        .mode-btn.selected { background-color: #ff5722 !important; border: 2px solid #ffccbc; }
        .player-btn { width: 30%; display: inline-block; background-color: #455a64; color: white; margin-right: 3%; text-align: center; }
        .player-btn:last-child { margin-right: 0; }
        .player-btn.selected { background-color: #4caf50 !important; border: 2px solid #c8e6c9; }
        #startBtn { background-color: #e91e63; color: white; font-size: 1.3rem; padding: 18px; margin-top: 10px; }
        .back-btn { background-color: #78909c; color: white; font-size: 1.1rem; margin-top: 20px; }
        .hidden { display: none; }

        .name-input-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .name-input-group label {
            width: 50px;
            font-weight: bold;
            color: #bbdefb;
            text-align: left;
        }
        .name-input-group input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #546e7a;
            background-color: #263238;
            color: white;
        }
    </style>
</head>
<body>

    <h1>Button GAME コントローラー</h1>
    <div id="status" class="disconnected">未接続</div>

    <button id="connectBtn" onclick="toggleConnection()">Bluetooth接続</button>

    <!-- ================= 1. メニュー画面 ================= -->
    <div id="menuView" class="view active">
        
        <div class="section" id="nameSection">
            <h2>プレイヤー名設定</h2>
            <div class="name-input-group"><label>P1</label><input type="text" id="p1Name" value="プレイヤー1"></div>
            <div class="name-input-group"><label>P2</label><input type="text" id="p2Name" value="プレイヤー2"></div>
            <div class="name-input-group" id="p3Group"><label>P3</label><input type="text" id="p3Name" value="プレイヤー3"></div>
            <div class="name-input-group" id="p4Group"><label>P4</label><input type="text" id="p4Name" value="プレイヤー4"></div>
        </div>

        <div class="section" id="playerSection">
            <h2>参加人数 (マルチプレイ用)</h2>
            <div style="text-align: center;">
                <button class="player-btn selected" onclick="selectPlayers(2, this)">2人</button>
                <button class="player-btn" onclick="selectPlayers(3, this)">3人</button>
                <button class="player-btn" onclick="selectPlayers(4, this)">4人</button>
            </div>
        </div>

        <div class="section">
            <h2>ゲームモード別設定</h2>
            <button class="mode-btn selected" id="mBtn1" onclick="selectMode(1, this)">1. 遅咲きタイムアタック</button>
            <button class="mode-btn" id="mBtn2" onclick="selectMode(2, this)">2. 連打サバイバル</button>
            <button class="mode-btn" id="mBtn3" onclick="selectMode(3, this)">3. 加速ルーレット</button>
            <button class="mode-btn" id="mBtn4" onclick="selectMode(4, this)">4. 最多連打サバイバル（1位以外罰）</button>
            <button class="mode-btn" id="mBtn5" onclick="selectMode(5, this)">5. 1人プレイ両手連打アタック</button>
        </div>

        <button id="startBtn" onclick="sendGameStart()">🚀 ゲームスタート！！</button>
    </div>

    <!-- ================= 2. プレイ中ライブモニター画面 ================= -->
    <div id="gameView" class="view">
        <h2 id="activeModeTitle">⚔️ ゲームライブモニター</h2>
        
        <div id="liveAlertBox">スタンバイ中...</div>

        <div id="dynamicDisplay">
            <p id="bigMainText">待機中...</p>
            <p id="subText">ESP32からの信号を待っています</p>
        </div>

        <button class="back-btn" onclick="returnToMenu()">🏠 メニューに戻る</button>
    </div>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_TX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let txCharacteristic = null;

        let selectedMode = 1;
        let selectedPlayers = 2;
        let playerNames = ["プレイヤー1", "プレイヤー2", "プレイヤー3", "プレイヤー4"];

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeep(type) {
            try {
                initAudio();
                if (!audioCtx) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                if (type === 0) {
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                } else {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                }

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log("音声再生エラー:", e);
            }
        }

        async function toggleConnection() {
            if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                await connectBluetooth();
            } else {
                disconnectBluetooth();
            }
        }

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "接続中...";
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Button GAME' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattservicedisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
                txCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                updateConnectionUI(true);

            } catch (error) {
                console.log("接続エラー: ", error);
                updateConnectionUI(false);
            }
        }

        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            onDisconnected();
        }

        function updateConnectionUI(isConnected) {
            const statusDiv = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');

            if (isConnected) {
                statusDiv.innerText = "接続完了！";
                statusDiv.className = "connected";
                connectBtn.innerText = "切断する";
            } else {
                statusDiv.innerText = "未接続";
                statusDiv.className = "disconnected";
                connectBtn.innerText = "Bluetooth接続";
                returnToMenu();
            }
        }

        function onDisconnected() {
            updateConnectionUI(false);
            bluetoothDevice = null;
            rxCharacteristic = null;
            txCharacteristic = null;
        }

        // スマホ側で自律的に3秒カウントダウンを実行する関数
        function runBrowserCountdown() {
            const display = document.getElementById('dynamicDisplay');
            let count = 3;

            display.innerHTML = `<p id="bigMainText" style="color:#ff9800; font-size:3rem; margin:0;">⏳ ${count}</p><p id="subText" style="color:#b0bec5; margin-top:10px;">まもなくスタート！</p>`;
            playBeep(0);

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    display.innerHTML = `<p id="bigMainText" style="color:#ff9800; font-size:3rem; margin:0;">⏳ ${count}</p><p id="subText" style="color:#b0bec5; margin-top:10px;">まもなくスタート！</p>`;
                    playBeep(0);
                } else {
                    clearInterval(timer);
                }
            }, 1000);
        }

        // ESP32からの通知を受け取る関数
        function handleNotifications(event) {
            let value = new TextDecoder().decode(event.target.value);
            value = value.trim();
            console.log("【スマホ受信】:", value);

            const alertBox = document.getElementById('liveAlertBox');
            const display = document.getElementById('dynamicDisplay');

            let bigText = document.getElementById('bigMainText');
            let subText = document.getElementById('subText');

            if (!bigText) {
                display.innerHTML = `<p id="bigMainText" style="color:#ffeb3b; font-size:2.5rem; margin:0;"></p><p id="subText" style="color:#b0bec5; margin-top:10px;"></p>`;
                bigText = document.getElementById('bigMainText');
                subText = document.getElementById('subText');
            }

            if (value.startsWith("NOTOUCH:")) {
                let pIndex = parseInt(value.split(":")[1].replace("P", "")) - 1;
                let name = playerNames[pIndex] || `プレイヤー${pIndex+1}`;
                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#d32f2f";
                alertBox.innerText = `⚠️ ${name} さん、鉄板に手を置いてください！`;
            } 
            else if (value.startsWith("DISCONNECT:")) {
                let pIndex = parseInt(value.split(":")[1].replace("P", "")) - 1;
                let name = playerNames[pIndex] || `プレイヤー${pIndex+1}`;
                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#c62828";
                alertBox.innerText = `🚨 ${name} が手を離しました！ゲーム中止！`;
            }
            else if (value === "STATUS:READY") {
                alertBox.style.display = "block";
                alertBox.style.backgroundColor = "#2e7d32";
                alertBox.innerText = "✨ 全員セット完了！";
            }
            else if (value === "START_COUNTDOWN") {
                alertBox.style.display = "none";
                runBrowserCountdown(); // スマホ側で綺麗にカウントダウンを回す！
            }
            else if (value.startsWith("SOLO_SCORE:")) {
                let score = value.split(":")[1];
                alertBox.style.display = "none";
                display.innerHTML = `<p id="bigMainText" style="color:#4caf50; font-size:3rem; margin:0;">${score} 回</p><p id="subText" style="color:#b0bec5; margin-top:10px;">両手連打アタック中！</p>`;
            }
            else if (selectedMode === 1) {
                if (value === "STATE:WAITING") {
                    bigText.style.color = "#ff5722";
                    bigText.innerText = "🤫 静かに！！";
                    subText.innerText = "合図が出るまで我慢しろ！";
                } else if (value === "STATE:SIGNAL") {
                    bigText.style.color = "#4caf50";
                    bigText.innerText = "⚡ 今だ！！押せ！！";
                    subText.innerText = "";
                }
            } 
            else if (selectedMode === 2) {
                if (value.startsWith("TARGET:")) {
                    let count = value.split(":")[1];
                    bigText.style.color = "#ffeb3b";
                    bigText.innerText = `🎯 目標: ${count} 回`;
                    subText.innerText = "この回数を目指して連打！";
                }
            } 
            else if (selectedMode === 3) {
                if (value.startsWith("ROULETTE:")) {
                    let pIndex = parseInt(value.split(":")[1].replace("P", "")) - 1;
                    let name = playerNames[pIndex] || `プレイヤー${pIndex+1}`;
                    bigText.style.color = "#03a9f4";
                    bigText.innerText = `🎯 ${name}`;
                    subText.innerText = "に決定！制限時間内に押せ！";
                }
            } 
            else if (selectedMode === 4) {
                if (value.startsWith("SCORE:")) {
                    let scores = value.split(":")[1].split(",");
                    let html = `<div class="score-grid">`;
                    for (let i = 0; i < selectedPlayers; i++) {
                        let name = playerNames[i] || `P${i+1}`;
                        let score = scores[i] || 0;
                        html += `<div class="score-card">${name}<br><span>${score}</span>回</div>`;
                    }
                    html += `</div>`;
                    display.innerHTML = html;
                }
            }
        }

        async function sendData(dataStr) {
            if (!rxCharacteristic) return false;
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(dataStr + "\n"));
                return true;
            } catch (error) {
                console.log("送信エラー: ", error);
                return false;
            }
        }

        function selectMode(modeNum, elem) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
            elem.classList.add('selected');
            selectedMode = modeNum;

            const playerSection = document.getElementById('playerSection');
            const nameSection = document.getElementById('nameSection');
            if (modeNum === 5) {
                playerSection.classList.add('hidden');
                nameSection.classList.add('hidden');
            } else {
                playerSection.classList.remove('hidden');
                nameSection.classList.remove('hidden');
            }
        }

        function selectPlayers(num, elem) {
            document.querySelectorAll('.player-btn').forEach(btn => btn.classList.remove('selected'));
            elem.classList.add('selected');
            selectedPlayers = num;

            document.getElementById('p3Group').style.display = (num >= 3) ? 'flex' : 'none';
            document.getElementById('p4Group').style.display = (num >= 4) ? 'flex' : 'none';
        }

        async function sendGameStart() {
            initAudio();

            playerNames[0] = document.getElementById('p1Name').value || "プレイヤー1";
            playerNames[1] = document.getElementById('p2Name').value || "プレイヤー2";
            playerNames[2] = document.getElementById('p3Name').value || "プレイヤー3";
            playerNames[3] = document.getElementById('p4Name').value || "プレイヤー4";

            document.getElementById('menuView').classList.remove('active');
            document.getElementById('gameView').classList.add('active');
            document.getElementById('activeModeTitle').innerText = `⚔️ モード ${selectedMode} ライブモニター`;

            const display = document.getElementById('dynamicDisplay');
            if (selectedMode === 4) {
                let html = `<div class="score-grid">`;
                for (let i = 0; i < selectedPlayers; i++) {
                    html += `<div class="score-card">${playerNames[i]}<br><span>0</span>回</div>`;
                }
                html += `</div>`;
                display.innerHTML = html;
            } else if (selectedMode === 5) {
                display.innerHTML = `<p id="bigMainText" style="color:#ff9800; font-size:3rem; margin:0;">⏳ 3</p><p id="subText" style="color:#b0bec5; margin-top:10px;">まもなくスタート！</p>`;
                playBeep(0);
            } else {
                display.innerHTML = `<p id="bigMainText" style="color:#ffeb3b; font-size:2.5rem; margin:0;">待機中...</p><p id="subText" style="color:#b0bec5; margin-top:10px;">鉄板に手を置いてください</p>`;
            }

            if (selectedMode !== 5) {
                await sendData(`PLAYERS:${selectedPlayers}`);
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            await sendData(`MODE:${selectedMode}`);
        }

        function returnToMenu() {
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('menuView').classList.add('active');
        }
    </script>
</body>
</html>
