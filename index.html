<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button GAME コントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #ff9800;
        }
        #status {
            font-size: 0.9rem;
            margin-bottom: 20px;
            padding: 8px;
            border-radius: 4px;
            background-color: #333;
        }
        .connected { background-color: #2e7d32 !important; }
        .disconnected { background-color: #c62828 !important; }
        
        .section {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
        }
        h2 {
            font-size: 1rem;
            margin-top: 0;
            color: #bbdefb;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.7;
        }
        #connectBtn {
            background-color: #2196f3;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .mode-btn {
            background-color: #37474f;
            color: white;
            text-align: left;
            padding-left: 20px;
        }
        .mode-btn.selected {
            background-color: #ff5722 !important;
            border: 2px solid #ffccbc;
        }
        .player-btn {
            width: 30%;
            display: inline-block;
            background-color: #455a64;
            color: white;
            margin-right: 3%;
            text-align: center;
        }
        .player-btn:last-child {
            margin-right: 0;
        }
        .player-btn.selected {
            background-color: #4caf50 !important;
            border: 2px solid #c8e6c9;
        }
        #startBtn {
            background-color: #e91e63;
            color: white;
            font-size: 1.3rem;
            padding: 18px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(233, 30, 99, 0.4);
        }
    </style>
</head>
<body>

    <h1>Button GAME コントローラー</h1>
    <div id="status" class="disconnected">未接続</div>

    <button id="connectBtn" onclick="toggleConnection()">Bluetooth接続</button>

    <div class="section">
        <h2>参加人数 (マルチプレイ用)</h2>
        <div style="text-align: center;">
            <button class="player-btn selected" onclick="selectPlayers(2, this)">2人</button>
            <button class="player-btn" onclick="selectPlayers(3, this)">3人</button>
            <button class="player-btn" onclick="selectPlayers(4, this)">4人</button>
        </div>
    </div>

    <div class="section">
        <h2>ゲームモード選択</h2>
        <button class="mode-btn selected" id="mBtn1" onclick="selectMode(1, this)">1. 遅咲きタイムアタック</button>
        <button class="mode-btn" id="mBtn2" onclick="selectMode(2, this)">2. 連打サバイバル</button>
        <button class="mode-btn" id="mBtn3" onclick="selectMode(3, this)">3. 加速ルーレット</button>
        <button class="mode-btn" id="mBtn4" onclick="selectMode(4, this)">4. 最多連打サバイバル（1位以外罰）</button>
        <button class="mode-btn" id="mBtn5" onclick="selectMode(5, this)">5. 1人プレイ両手連打アタック</button>
    </div>

    <button id="startBtn" onclick="sendGameStart()">🚀 ゲームスタート！！</button>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice = null;
        let rxCharacteristic = null;

        // 現在選ばれている設定を保持
        let selectedMode = 1;
        let selectedPlayers = 2;

        async function toggleConnection() {
            if (!bluetoothDevice || !bluetoothDevice.gatt.connected) {
                await connectBluetooth();
            } else {
                await disconnectBluetooth();
            }
        }

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "接続中...";
                
                // 「Button GAME」という名前のデバイスを直接フィルタリングして探す
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Button GAME' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattservicedisconnected', onDisconnected);

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);

                document.getElementById('status').innerText = "接続完了！";
                document.getElementById('status').className = "connected";
                document.getElementById('connectBtn').innerText = "切断する";

            } catch (error) {
                console.log("接続エラー: ", error);
                document.getElementById('status').innerText = "未接続（キャンセルまたは失敗）";
                document.getElementById('status').className = "disconnected";
            }
        }

        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function onDisconnected() {
            document.getElementById('status').innerText = "未接続";
            document.getElementById('status').className = "disconnected";
            document.getElementById('connectBtn').innerText = "Bluetooth接続";
            bluetoothDevice = null;
            rxCharacteristic = null;
        }

        async function sendData(dataStr) {
            if (!rxCharacteristic) {
                alert("ESP32に接続されていません！上部の「Bluetooth接続」を押してください。");
                return false;
            }
            try {
                const encoder = new TextEncoder();
                await rxCharacteristic.writeValue(encoder.encode(dataStr + "\n"));
                console.log("送信成功: " + dataStr);
                return true;
            } catch (error) {
                console.log("送信エラー: ", error);
                alert("送信に失敗しました。");
                return false;
            }
        }

        function selectMode(modeNum, elem) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('selected'));
            elem.classList.add('selected');
            selectedMode = modeNum;
        }

        function selectPlayers(num, elem) {
            document.querySelectorAll('.player-btn').forEach(btn => btn.classList.remove('selected'));
            elem.classList.add('selected');
            selectedPlayers = num;
        }

        // 「ゲームスタート」ボタンを押したときに、人数とモードをまとめてESP32へ送信！
        async function sendGameStart() {
            // まとめてコマンド送信
            let success = await sendData(`PLAYERS:${selectedPlayers}`);
            if (!success) return;
            
            // 少しウェイトを挟んでモードを送信
            await new Promise(resolve => setTimeout(resolve, 100));
            await sendData(`MODE:${selectedMode}`);

            alert(`【送信完了】 モード ${selectedMode} / ${selectedPlayers}人 でスタートします！`);
        }
    </script>
</body>
</html>
