<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 ビリビリゲーム コントローラー</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 1.4rem; margin-bottom: 5px; color: #ff5252; text-align: center; }
        .subtitle { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; text-align: center; }
        
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .card h2 { font-size: 1rem; margin-top: 0; color: #4facfe; }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #connectBtn { background: #4facfe; color: #fff; margin-bottom: 10px; }
        #connectBtn.connected { background: #4caf50; }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .option-btn {
            flex: 1;
            background: #333;
            color: #fff;
            padding: 10px;
            font-size: 0.9rem;
            border-radius: 6px;
        }
        .option-btn.active {
            background: #ff5252;
            color: #fff;
        }

        .mode-btn {
            background: #2a2a2a;
            color: #fff;
            text-align: left;
            margin-bottom: 8px;
            padding: 12px;
            border: 1px solid #444;
        }
        .mode-btn.active {
            border-color: #ff5252;
            background: #3a1c1c;
        }
        .mode-btn small { display: block; color: #aaa; font-weight: normal; margin-top: 3px; font-size: 0.8rem; }

        #startBtn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 1.2rem;
            padding: 15px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }
        #startBtn:disabled {
            background: #444;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>⚡ ビリビリ・バトル・システム</h1>
    <div class="subtitle">ESP32 コントロールパネル</div>

    <!-- 接続カード -->
    <div class="card">
        <button id="connectBtn" onclick="connectBluetooth()">ESP32にBluetooth接続</button>
        <div id="status">未接続</div>
    </div>

    <!-- 参加人数選択 -->
    <div class="card" id="playersCard">
        <h2>👥 参加人数 (マルチプレイ用)</h2>
        <div class="btn-group">
            <button class="option-btn" onclick="setPlayers(2)">2人</button>
            <button class="option-btn" onclick="setPlayers(3)">3人</button>
            <button class="option-btn active" onclick="setPlayers(4)">4人</button>
        </div>
    </div>

    <!-- ゲームモード選択 -->
    <div class="card">
        <h2>🎮 ゲームモード選択</h2>
        <button class="mode-btn active" id="mode1Btn" onclick="setMode(1)">
            モード1：遅咲きタイムアタック
            <small>ブザー後に一番遅かった人、またはフライングした人がビリビリ！</small>
        </button>
        <button class="mode-btn" id="mode2Btn" onclick="setMode(2)">
            モード2：連打サバイバル
            <small>目標回数に向けた連打勝負！ 勝者以外全員ビリビリ！</small>
        </button>
        <button class="mode-btn" id="mode3Btn" onclick="setMode(3)">
            モード3：加速ルーレット
            <small>次々点滅するボタン。時間内に押せないとビリビリ！</small>
        </button>
        <button class="mode-btn" id="mode4Btn" onclick="setMode(4)">
            モード4：1人プレイアタック
            <small>制限時間60秒の限界ヒッティング（1人専用）</small>
        </button>
    </div>

    <!-- スタートボタン -->
    <div class="card">
        <button id="startBtn" onclick="sendGameConfig()" disabled>▶ ゲームスタート！</button>
    </div>

    <script>
        // BLEの設定（ESP32側のUUIDに合わせて変更可能）
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a9";

        let bluetoothDevice = null;
        let pCharacteristic = null;

        let selectedPlayers = 4;
        let selectedMode = 1;

        async function connectBluetooth() {
            try {
                document.getElementById('status').innerText = "デバイスを検索中...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                pCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                document.getElementById('connectBtn').innerText = "接続完了 ✓";
                document.getElementById('connectBtn').classList.add('connected');
                document.getElementById('status').innerText = "ESP32と接続しました";
                document.getElementById('startBtn').disabled = false;

                bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "接続失敗・キャンセルされました";
            }
        }

        function onDisconnected() {
            document.getElementById('connectBtn').innerText = "ESP32にBluetooth接続";
            document.getElementById('connectBtn').classList.remove('connected');
            document.getElementById('status').innerText = "切断されました";
            document.getElementById('startBtn').disabled = true;
        }

        function setPlayers(num) {
            selectedPlayers = num;
            const buttons = document.querySelectorAll('#playersCard .option-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        function setMode(mode) {
            selectedMode = mode;
            for (let i = 1; i <= 4; i++) {
                document.getElementById(`mode{i}Btn`?.replace('{i}', i)).classList.remove('active');
            }
            document.getElementById(`mode${mode}Btn`).classList.add('active');

            // モード4は1人専用なので人数選択を無効化または1人に固定する見た目にする
            const playersCard = document.getElementById('playersCard');
            if (mode === 4) {
                playersCard.style.opacity = "0.4";
            } else {
                playersCard.style.opacity = "1.0";
            }
        }

        async function sendGameConfig() {
            if (!pCharacteristic) {
                alert("Bluetoothが接続されていません！");
                return;
            }

            // 送信データフォーマット: "モード,人数" (例: "1,4" や "4,1")
            let playersToSend = (selectedMode === 4) ? 1 : selectedPlayers;
            let dataString = `${selectedMode},${playersToSend}`;
            let encoder = new TextEncoder();

            try {
                await pCharacteristic.writeValue(encoder.encode(dataString));
                document.getElementById('status').innerText = `送信成功: モード${selectedMode} (${playersToSend}人)`;
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "データの送信に失敗しました";
            }
        }
    </script>
</body>
</html>
