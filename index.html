<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ サイバー・ボタンバトル ⚡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0b0f19;
            color: #00ffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { font-size: 1.2rem; margin: 5px 0; color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }
        #status { font-size: 0.85rem; margin-bottom: 12px; padding: 8px; border-radius: 6px; background: #1a233a; border: 1px solid #3b82f6; font-weight: bold; }
        .connected { color: #00ffcc !important; border-color: #00ffcc !important; }
        .disconnected { color: #ff3366 !important; border-color: #ff3366 !important; }
        .view { display: none; }
        .view.active { display: block; }
        .panel { background: rgba(17, 24, 39, 0.85); border: 2px solid #1e3a8a; border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        h2 { font-size: 0.95rem; margin-top: 0; color: #38bdf8; border-bottom: 1px dashed #1e3a8a; padding-bottom: 5px; }
        .cyber-btn { width: 100%; padding: 12px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; font-weight: 700; border: 2px solid #374151; border-radius: 8px; background: #1f2937; color: #9ca3af; cursor: pointer; margin-bottom: 8px; }
        .cyber-btn.selected { background: #701a75; border-color: #e879f9; color: #fff; }
        .mode-btn { text-align: left; padding-left: 15px; color: #d1d5db; }
        .mode-btn.selected { background: #0c4a6e; border-color: #38bdf8; color: #00ffff; }
        #connectBtn { background: #1d4ed8; color: white; font-size: 1rem; padding: 14px; }
        #launchBtn { background: linear-gradient(135deg, #db2777, #9333ea); color: white; font-size: 1.1rem; padding: 16px; }
        #gameView { background: rgba(15, 23, 42, 0.95); border: 2px solid #00ffff; border-radius: 14px; padding: 20px; }
        #battleDisplay { background: #020617; border: 2px solid #3b82f6; border-radius: 12px; padding: 20px 10px; margin: 15px 0; min-height: 140px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #mainOutput { font-size: 2.8rem; font-weight: 900; color: #4ade80; margin: 0; }
        #subOutput { font-size: 1.1rem; color: #38bdf8; margin-top: 10px; }
        #timerOutput { font-size: 1.3rem; color: #facc15; margin-bottom: 10px; font-weight: bold; }
        #alertBanner { background: #991b1b; color: #fff; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 15px; display: none; }
        .back-cyber-btn { background: #334155; color: #cbd5e1; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>⚡ サイバー・ボタンバトル ⚡</h1>
    <div id="status" class="disconnected">ステータス: 未接続</div>
    <button class="cyber-btn" id="connectBtn" onclick="toggleConnection()">🔗 Bluetooth接続</button>

    <div id="menuView" class="view active">
        <div class="panel">
            <h2>🎮 ゲームモード選択</h2>
            <button class="cyber-btn mode-btn selected" onclick="setMode(5, this)">05. 🚀 1人プレイ両手連打アタック</button>
        </div>
        <button class="cyber-btn" id="launchBtn" onclick="launchGame()">🚀 ゲームスタート！！</button>
    </div>

    <div id="gameView" class="view">
        <h2 id="modeTitle" style="color:#00ffff; text-align:center; border:none; font-size:1.1rem;">バトルモニター</h2>
        <div id="alertBanner">警告</div>
        <div id="battleDisplay">
            <div id="timerOutput">残り時間: 60秒</div>
            <p id="mainOutput">0 回</p>
            <p id="subOutput">両手連打アタック中！</p>
        </div>
        <button class="cyber-btn back-cyber-btn" onclick="returnMenu()">🏠 中断してメニューに戻る</button>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let device = null, rxChar = null, txChar = null;
        let activeMode = 5;
        let gameTimer = null;

        async function toggleConnection() {
            if (!device || !device.gatt.connected) {
                try {
                    device = await navigator.bluetooth.requestDevice({
                        filters: [{ name: 'Button GAME' }],
                        optionalServices: [SERVICE_UUID]
                    });
                    device.addEventListener('gattservicedisconnected', onDisconnect);
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    rxChar = await service.getCharacteristic(RX_UUID);
                    txChar = await service.getCharacteristic(TX_UUID);
                    await txChar.startNotifications();
                    txChar.addEventListener('characteristicvaluechanged', onReceive);
                    updateUI(true);
                } catch (err) { updateUI(false); }
            } else {
                device.gatt.disconnect();
                onDisconnect();
            }
        }

        function onDisconnect() { updateUI(false); device = null; rxChar = null; txChar = null; }

        function updateUI(isConnected) {
            const stat = document.getElementById('status');
            const btn = document.getElementById('connectBtn');
            if (isConnected) {
                stat.innerText = "ステータス: 接続完了"; stat.className = "connected"; btn.innerText = "🔌 切断する";
            } else {
                stat.innerText = "ステータス: 未接続"; stat.className = "disconnected"; btn.innerText = "🔗 Bluetooth接続";
                returnMenu();
            }
        }

        function setMode(num, el) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            activeMode = num;
        }

        async function sendData(str) {
            if (!rxChar) return;
            try { await rxChar.writeValue(new TextEncoder().encode(str + "\n")); } catch(e) {}
        }

        function onReceive(event) {
            let msg = new TextDecoder().decode(event.target.value).trim();
            const alertBox = document.getElementById('alertBanner');
            let main = document.getElementById('mainOutput');

            if (!main) return;

            if (msg.startsWith("SOLO_SCORE:")) {
                let score = msg.split(":")[1];
                alertBox.style.display = "none";
                main.innerText = `${score} 回`;
            } else if (msg.startsWith("ALERT:")) {
                alertBox.style.display = "block";
                alertBox.innerText = msg.split(":")[1];
                if (gameTimer) clearInterval(gameTimer);
            }
        }

        async function launchGame() {
            document.getElementById('menuView').classList.remove('active');
            document.getElementById('gameView').classList.add('active');
            
            document.getElementById('mainOutput').innerText = "0 回";
            
            // 60秒の残り時間カウントダウンタイマーをスマホ側でスタート
            let timeLeft = 60;
            document.getElementById('timerOutput').innerText = `残り時間: ${timeLeft}秒`;
            
            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft >= 0) {
                    document.getElementById('timerOutput').innerText = `残り時間: ${timeLeft}秒`;
                } else {
                    clearInterval(gameTimer);
                }
            }, 1000);

            // ESP32へモード5開始指令を送信（ESP32側で3秒ブザーが鳴ったあとにゲーム本編が始まります）
            await sendData(`MODE:5`);
        }

        async function returnMenu() {
            if (gameTimer) clearInterval(gameTimer);
            await sendData(`MODE:1`);
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('menuView').classList.add('active');
        }
    </script>
</body>
</html>
