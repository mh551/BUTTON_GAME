<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ サイバー・ボタンバトル ⚡</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0b0f19;
            color: #00ffff;
            margin: 0;
            padding: 15px;
            text-align: center;
            overflow-x: hidden;
        }

        h1 {
            font-size: 1.2rem;
            margin: 5px 0;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            letter-spacing: 2px;
        }

        #status {
            font-size: 0.85rem;
            margin-bottom: 12px;
            padding: 8px;
            border-radius: 6px;
            background: #1a233a;
            border: 1px solid #3b82f6;
            font-weight: bold;
        }
        .connected { color: #00ffcc !important; border-color: #00ffcc !important; box-shadow: 0 0 10px rgba(0,255,204,0.4); }
        .disconnected { color: #ff3366 !important; border-color: #ff3366 !important; box-shadow: 0 0 10px rgba(255,51,102,0.4); }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .panel {
            background: rgba(17, 24, 39, 0.85);
            border: 2px solid #1e3a8a;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(30, 58, 138, 0.5);
            text-align: left;
        }

        h2 {
            font-size: 0.95rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed #1e3a8a;
            padding-bottom: 5px;
        }

        .name-group {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .name-group label {
            width: 45px;
            font-weight: bold;
            color: #93c5fd;
        }
        .name-group input {
            flex: 1;
            padding: 10px;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            background: #030712;
            border: 1px solid #2563eb;
            color: #fff;
            border-radius: 6px;
            outline: none;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cyber-btn {
            width: 100%;
            padding: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            border: 2px solid #374151;
            border-radius: 8px;
            background: #1f2937;
            color: #9ca3af;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cyber-btn.selected {
            background: #701a75;
            border-color: #e879f9;
            color: #fff;
            box-shadow: 0 0 12px rgba(232, 121, 249, 0.6);
        }

        .mode-btn {
            display: block;
            width: 100%;
            text-align: left;
            margin-bottom: 8px;
            padding: 12px 15px;
            background: #111827;
            border: 1px solid #374151;
            color: #d1d5db;
        }
        .mode-btn.selected {
            background: #0c4a6e;
            border-color: #38bdf8;
            color: #00ffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        #connectBtn {
            background: #1d4ed8;
            border: 2px solid #60a5fa;
            color: white;
            font-size: 1rem;
            padding: 14px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(29, 78, 216, 0.6);
        }

        #launchBtn {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border: 2px solid #f472b6;
            color: white;
            font-size: 1.1rem;
            padding: 16px;
            box-shadow: 0 0 20px rgba(219, 39, 119, 0.8);
        }

        #gameView {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            border-radius: 14px;
            padding: 20px;
        }

        #battleDisplay {
            background: #020617;
            border: 2px solid #3b82f6;
            border-radius: 12px;
            padding: 30px 10px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #mainOutput {
            font-size: 3rem;
            font-weight: 900;
            color: #facc15;
            margin: 0;
        }

        #subOutput {
            font-size: 1.1rem;
            color: #38bdf8;
            margin-top: 15px;
        }

        #alertBanner {
            background: #991b1b;
            border: 2px solid #f87171;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }

        .score-box-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .score-card {
            background: #1e293b;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
        }
        .score-card span {
            font-size: 1.6rem;
            color: #4ade80;
            font-weight: 900;
            display: block;
            margin-top: 5px;
        }

        .back-cyber-btn {
            background: #334155;
            border: 1px solid #64748b;
            color: #cbd5e1;
            margin-top: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>⚡ サイバー・ボタンバトル ⚡</h1>
    <div id="status" class="disconnected">ステータス: 未接続</div>

    <button class="cyber-btn" id="connectBtn" onclick="toggleConnection()">🔗 Bluetooth接続</button>

    <!-- 1. 設定メニュー画面 -->
    <div id="menuView" class="view active">
        <div class="panel" id="namePanel">
            <h2>👤 プレイヤー名設定</h2>
            <div class="name-group"><label>P1</label><input type="text" id="p1Name" value="プレイヤー1"></div>
            <div class="name-group"><label>P2</label><input type="text" id="p2Name" value="プレイヤー2"></div>
            <div class="name-group" id="p3Box"><label>P3</label><input type="text" id="p3Name" value="プレイヤー3"></div>
            <div class="name-group" id="p4Box"><label>P4</label><input type="text" id="p4Name" value="プレイヤー4"></div>
        </div>

        <div class="panel" id="playerCountPanel">
            <h2>👥 参加人数</h2>
            <div class="btn-grid">
                <button class="cyber-btn selected" onclick="setPlayers(2, this)">2人対戦</button>
                <button class="cyber-btn" onclick="setPlayers(3, this)">3人対戦</button>
                <button class="cyber-btn" onclick="setPlayers(4, this)">4人対戦</button>
            </div>
        </div>

        <div class="panel">
            <h2>🎮 ゲームモード選択</h2>
            <button class="cyber-btn mode-btn selected" onclick="setMode(1, this)">01. ⚡ 遅咲きタイムアタック</button>
            <button class="cyber-btn mode-btn" onclick="setMode(2, this)">02. ⚔️ 連打サバイバル</button>
            <button class="cyber-btn mode-btn" onclick="setMode(3, this)">03. 🎯 加速ルーレット</button>
            <button class="cyber-btn mode-btn" onclick="setMode(4, this)">04. 🔥 最多連打サバイバル（1位以外罰）</button>
            <button class="cyber-btn mode-btn" onclick="setMode(5, this)">05. 🚀 1人プレイ両手連打アタック</button>
        </div>

        <button class="cyber-btn" id="launchBtn" onclick="launchGame()">🚀 ゲームスタート！！</button>
    </div>

    <!-- 2. ライブバトルモニター画面 -->
    <div id="gameView" class="view">
        <h2 id="modeTitle" style="color:#00ffff; text-align:center; border:none; font-size:1.1rem;">バトルモニター</h2>
        <div id="alertBanner">警告: システムアラート</div>
        <div id="battleDisplay">
            <p id="mainOutput">待機中</p>
            <p id="subOutput">シグナルを待っています</p>
        </div>
        <button class="cyber-btn back-cyber-btn" onclick="returnMenu()">🏠 中断してメニューに戻る</button>
    </div>

    <script>
        const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
        const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let device = null, rxChar = null, txChar = null;
        let activeMode = 1;
        let activePlayers = 2;
        let pilots = ["プレイヤー1", "プレイヤー2", "プレイヤー3", "プレイヤー4"];
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playCyberSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                if (type === 0) {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.15);
                } else if (type === 1) {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.25);
                } else if (type === 2) {
                    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                }
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.25);
            } catch(e) {}
        }

        async function toggleConnection() {
            if (!device || !device.gatt.connected) {
                try {
                    document.getElementById('status').innerText = "接続中...";
                    device = await navigator.bluetooth.requestDevice({
                        filters: [{ name: 'Button GAME' }],
                        optionalServices: [SERVICE_UUID]
                    });
                    device.addEventListener('gattservicedisconnected', onDisconnect);
                    const server = await device.gatt.connect();
                    const service = await server.getPrimaryService(SERVICE_UUID);
                    rxChar = await service.getCharacteristic(RX_UUID);
                    txChar = await service.getCharacteristic(TX_UUID);
                    await txChar.startNotifications();
                    txChar.addEventListener('characteristicvaluechanged', onReceive);
                    updateUI(true);
                } catch (err) {
                    console.log(err);
                    updateUI(false);
                }
            } else {
                device.gatt.disconnect();
                onDisconnect();
            }
        }

        function onDisconnect() {
            updateUI(false);
            device = null;
            rxChar = null;
            txChar = null;
        }

        function updateUI(isConnected) {
            const stat = document.getElementById('status');
            const btn = document.getElementById('connectBtn');
            if (isConnected) {
                stat.innerText = "ステータス: 接続完了";
                stat.className = "connected";
                btn.innerText = "🔌 切断する";
            } else {
                stat.innerText = "ステータス: 未接続";
                stat.className = "disconnected";
                btn.innerText = "🔗 Bluetooth接続";
                returnMenu();
            }
        }

        function setMode(num, el) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            activeMode = num;
            const pPanel = document.getElementById('playerCountPanel');
            const nPanel = document.getElementById('namePanel');
            if (num === 5) {
                pPanel.classList.add('hidden');
                nPanel.classList.add('hidden');
            } else {
                pPanel.classList.remove('hidden');
                nPanel.classList.remove('hidden');
            }
        }

        function setPlayers(num, el) {
            el.parentNode.querySelectorAll('.cyber-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            activePlayers = num;
            document.getElementById('p3Box').style.display = (num >= 3) ? 'flex' : 'none';
            document.getElementById('p4Box').style.display = (num >= 4) ? 'flex' : 'none';
        }

        async function sendData(str) {
            if (!rxChar) return;
            try {
                await rxChar.writeValue(new TextEncoder().encode(str + "\n"));
            } catch(e) { console.log(e); }
        }

        function onReceive(event) {
            let msg = new TextDecoder().decode(event.target.value).trim();
            console.log("受信データ:", msg);

            const alertBox = document.getElementById('alertBanner');
            const display = document.getElementById('battleDisplay');
            let main = document.getElementById('mainOutput');
            let sub = document.getElementById('subOutput');

            if (!main) return;

            if (msg.startsWith("SOLO_SCORE:")) {
                let score = msg.split(":")[1];
                alertBox.style.display = "none";
                main.style.color = "#4ade80";
                main.innerText = `${score} 回`;
                sub.innerText = "⚡ 両手連打アタック中！";
                playCyberSound(2);
            } else if (msg.startsWith("ALERT:")) {
                alertBox.style.display = "block";
                alertBox.style.background = "#1e3a8a";
                alertBox.innerText = msg.split(":")[1];
            } else if (msg.startsWith("NOTOUCH:")) {
                let idx = parseInt(msg.split(":")[1].replace("P","")) - 1;
                alertBox.style.display = "block";
                alertBox.innerText = `⚠️ ${pilots[idx] || 'プレイヤー'} : 鉄板から手が離れています！`;
            } else if (msg.startsWith("DISCONNECT:")) {
                let idx = parseInt(msg.split(":")[1].replace("P","")) - 1;
                alertBox.style.display = "block";
                alertBox.innerText = `🚨 ${pilots[idx] || 'プレイヤー'} : 中止！`;
            } else if (msg === "STATUS:READY") {
                alertBox.style.display = "block";
                alertBox.style.background = "#047857";
                alertBox.innerText = `✨ 全員セット完了！`;
            } else {
                alertBox.style.display = "none";
                if (activeMode === 1) {
                    if (msg === "STATE:WAITING") { main.style.color="#f97316"; main.innerText="静かに！"; sub.innerText="合図まで我慢！"; }
                    else if (msg === "STATE:SIGNAL") { main.style.color="#4ade80"; main.innerText="今だ！押せ！"; sub.innerText="アタック！"; playCyberSound(1); }
                } else if (activeMode === 2 && msg.startsWith("TARGET:")) {
                    main.style.color="#facc15"; main.innerText=`目標: ${msg.split(":")[1]}回`; sub.innerText="目標まで連打！";
                } else if (activeMode === 3 && msg.startsWith("ROULETTE:")) {
                    let idx = parseInt(msg.split(":")[1].replace("P","")) - 1;
                    main.style.color="#38bdf8"; main.innerText=`🎯 ${pilots[idx]}`; sub.innerText="急いで押せ！";
                } else if (activeMode === 4 && msg.startsWith("SCORE:")) {
                    let scores = msg.split(":")[1].split(",");
                    let html = `<div class="score-box-grid">`;
                    for(let i=0; i<activePlayers; i++) {
                        html += `<div class="score-card">${pilots[i]}<span>${scores[i]||0}</span>回</div>`;
                    }
                    html += `</div>`;
                    display.innerHTML = html;
                }
            }
        }

        async function launchGame() {
            initAudio();
            pilots[0] = document.getElementById('p1Name').value || "プレイヤー1";
            pilots[1] = document.getElementById('p2Name').value || "プレイヤー2";
            pilots[2] = document.getElementById('p3Name').value || "プレイヤー3";
            pilots[3] = document.getElementById('p4Name').value || "プレイヤー4";

            document.getElementById('menuView').classList.remove('active');
            document.getElementById('gameView').classList.add('active');
            document.getElementById('modeTitle').innerText = `⚔️ ゲームモード 0${activeMode}`;

            const display = document.getElementById('battleDisplay');

            if (activeMode === 5) {
                for(let c = 3; c > 0; c--) {
                    display.innerHTML = `<p id="mainOutput" style="font-size:3.5rem; color:#f97316;">⏳ ${c}</p><p id="subOutput">まもなくスタート！</p>`;
                    playCyberSound(0);
                    await new Promise(r => setTimeout(r, 1000));
                }
                display.innerHTML = `<p id="mainOutput" style="font-size:3.5rem; color:#4ade80;">0 回</p><p id="subOutput">⚡ 両手連打アタック開始！</p>`;
                playCyberSound(1);
                // 💡 モード5の開始指令を送信
                await sendData(`MODE:5`);
            } else {
                if (activeMode === 4) {
                    let html = `<div class="score-box-grid">`;
                    for(let i=0; i<activePlayers; i++) html += `<div class="score-card">${pilots[i]}<span>0</span>回</div>`;
                    html += `</div>`;
                    display.innerHTML = html;
                } else {
                    display.innerHTML = `<p id="mainOutput" style="font-size:2.2rem; color:#facc15;">待機中...</p><p id="subOutput">全員鉄板に手を置いてください</p>`;
                }
                await sendData(`PLAYERS:${activePlayers}`);
                await new Promise(r => setTimeout(r, 100));
                await sendData(`MODE:${activeMode}`);
            }
        }

        // 💡 中断ボタン：モードを1に強制リセットする指令をESP32に送ることで確実に中断させる
        async function returnMenu() {
            await sendData(`MODE:1`); 
            document.getElementById('gameView').classList.remove('active');
            document.getElementById('menuView').classList.add('active');
        }
    </script>
</body>
</html>
