<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイバー・ボタンバトル</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

    body {
      font-family: 'Orbitron', sans-serif;
      background: #0b0f19;
      color: #00ffff;
      margin: 0;
      padding: 15px;
      text-align: center;
    }

    h1 {
      font-size: 1.2rem;
      margin: 5px 0;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
    }

    #status {
      font-size: 0.85rem;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      background: #1a233a;
      border: 1px solid #3b82f6;
      font-weight: bold;
    }

    .connected {
      color: #00ffcc !important;
      border-color: #00ffcc !important;
    }

    .disconnected {
      color: #ff3366 !important;
      border-color: #ff3366 !important;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .panel {
      background: rgba(17, 24, 39, 0.85);
      border: 2px solid #1e3a8a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: left;
    }

    h2 {
      font-size: 0.95rem;
      margin-top: 0;
      color: #38bdf8;
      border-bottom: 1px dashed #1e3a8a;
      padding-bottom: 5px;
    }

    .cyber-btn {
      width: 100%;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      border: 2px solid #374151;
      border-radius: 8px;
      background: #1f2937;
      color: #9ca3af;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .mode-btn {
      text-align: left;
      padding-left: 15px;
      color: #d1d5db;
    }

    .mode-btn.selected {
      background: #0c4a6e;
      border-color: #38bdf8;
      color: #00ffff;
    }

    #connectBtn {
      background: #1d4ed8;
      color: white;
      font-size: 1rem;
      padding: 14px;
    }

    #launchBtn {
      background: linear-gradient(135deg, #db2777, #9333ea);
      color: white;
      font-size: 1.1rem;
      padding: 16px;
    }

    #gameView {
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #00ffff;
      border-radius: 14px;
      padding: 20px;
    }

    #battleDisplay {
      background: #020617;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 20px 10px;
      margin: 20px 0;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stats {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .stat-card {
      flex: 1;
      min-width: 0;
      background: #111827;
      border: 1px solid #1e3a8a;
      border-radius: 10px;
      padding: 14px 6px;
    }

    .stat-label {
      display: block;
      color: #38bdf8;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .stat-value {
      display: block;
      font-size: 2.2rem;
      font-weight: 900;
      color: #facc15;
      overflow-wrap: anywhere;
    }

    #scoreValue {
      color: #4ade80;
    }

    #timeValue.urgent {
      color: #ff3366;
    }

    #subOutput {
      font-size: 1rem;
      color: #38bdf8;
      margin: 18px 0 0;
    }

    #alertBanner {
      background: #991b1b;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 15px;
      display: none;
    }

    .back-cyber-btn {
      background: #334155;
      color: #cbd5e1;
      margin-top: 15px;
    }

    #replayBtn {
      display: none;
      background: linear-gradient(135deg, #059669, #0d9488);
      color: white;
      font-size: 1rem;
      margin-top: 10px;
    }

    .player-select-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #38bdf8;
      font-weight: bold;
    }

    #playerCount {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      padding: 8px;
      border-radius: 6px;
      background: #1f2937;
      color: #fff;
      border: 1px solid #38bdf8;
    }
  </style>
</head>

<body>
  <h1>サイバー・ボタンバトル</h1>

  <div id="status" class="disconnected">ステータス: 未接続</div>

  <button class="cyber-btn" id="connectBtn" onclick="toggleConnection()">
    Bluetooth接続
  </button>

  <div id="menuView" class="view active">
    <div class="panel">
      <h2>参加人数</h2>
      <label class="player-select-row" for="playerCount">
        <span>プレイヤー数</span>
        <select id="playerCount" onchange="changePlayerCount()">
          <option value="2">2人</option>
          <option value="3">3人</option>
          <option value="4">4人</option>
        </select>
      </label>
    </div>

    <div class="panel">
      <h2>ゲームモード選択</h2>

      <button class="cyber-btn mode-btn selected" onclick="setMode(1, this)">
        01. 早押し
      </button>

      <button class="cyber-btn mode-btn" onclick="setMode(2, this)">
        02. モード2
      </button>

      <button class="cyber-btn mode-btn" onclick="setMode(3, this)">
        03. モード3
      </button>

      <button class="cyber-btn mode-btn" onclick="setMode(4, this)">
        04. モード4
      </button>

      <button class="cyber-btn mode-btn" onclick="setMode(5, this)">
        05. 1人プレイ・タイムアタック
      </button>
    </div>

    <button class="cyber-btn" id="launchBtn" onclick="launchGame()">
      ゲームスタート
    </button>
  </div>

  <div id="gameView" class="view">
    <h2 id="modeTitle" style="color:#00ffff; text-align:center; border:none; font-size:1.1rem;">
      バトルモニター
    </h2>

    <div id="alertBanner">お知らせ</div>

    <div id="battleDisplay">
      <div class="stats">
        <div class="stat-card">
          <span class="stat-label">スコア</span>
          <span class="stat-value" id="scoreValue">0</span>
        </div>

        <div class="stat-card">
          <span class="stat-label">残り時間</span>
          <span class="stat-value" id="timeValue">--</span>
        </div>
      </div>

      <p id="subOutput">信号を待っています</p>
    </div>

    <button class="cyber-btn" id="replayBtn" onclick="replayGame()">
      もう一度プレイ
    </button>

    <button class="cyber-btn back-cyber-btn" onclick="returnMenu()">
      メニューに戻る
    </button>
  </div>

  <script>
    const SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
    const RX_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
    const TX_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

    let device = null;
    let rxChar = null;
    let txChar = null;
    let activeMode = 1;
    let audioContext = null;
    let selectedPlayers = 2;

    async function toggleConnection() {
      if (!device || !device.gatt.connected) {
        try {
          device = await navigator.bluetooth.requestDevice({
            filters: [{ name: "Button GAME" }],
            optionalServices: [SERVICE_UUID]
          });

          device.addEventListener("gattservicedisconnected", onDisconnect);

          const server = await device.gatt.connect();
          const service = await server.getPrimaryService(SERVICE_UUID);

          rxChar = await service.getCharacteristic(RX_UUID);
          txChar = await service.getCharacteristic(TX_UUID);

          await txChar.startNotifications();
          txChar.addEventListener(
            "characteristicvaluechanged",
            onReceive
          );

          updateUI(true);
          await sendData(`PLAYERS:${selectedPlayers}`);
        } catch (err) {
          console.error("Bluetooth接続エラー:", err);
          updateUI(false);
        }
      } else {
        device.gatt.disconnect();
        onDisconnect();
      }
    }

    function onDisconnect() {
      updateUI(false);
      device = null;
      rxChar = null;
      txChar = null;
    }

    function updateUI(isConnected) {
      const status = document.getElementById("status");
      const button = document.getElementById("connectBtn");

      if (isConnected) {
        status.innerText = "ステータス: 接続中";
        status.className = "connected";
        button.innerText = "切断する";
      } else {
        status.innerText = "ステータス: 未接続";
        status.className = "disconnected";
        button.innerText = "Bluetooth接続";

        document.getElementById("gameView").classList.remove("active");
        document.getElementById("menuView").classList.add("active");
      }
    }

    async function changePlayerCount() {
      selectedPlayers = Number(
        document.getElementById("playerCount").value
      );

      await sendData(`PLAYERS:${selectedPlayers}`);
    }

    function setMode(modeNumber, element) {
      document.querySelectorAll(".mode-btn").forEach(button => {
        button.classList.remove("selected");
      });

      element.classList.add("selected");
      activeMode = modeNumber;
    }

    async function sendData(text) {
      if (!rxChar) {
        return;
      }

      try {
        const data = new TextEncoder().encode(text + "\n");
        await rxChar.writeValue(data);
      } catch (err) {
        console.error("Bluetooth送信エラー:", err);
      }
    }

    function preparePhoneAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        return;
      }

      if (!audioContext) {
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(console.error);
      }
    }

    function playPhoneErrorSound() {
      if (!audioContext) {
        return;
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(console.error);
      }

      const now = audioContext.currentTime;
      playErrorTone(420, now, 0.18);
      playErrorTone(250, now + 0.2, 0.42);
    }

    function playErrorTone(frequency, startTime, duration) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(frequency, startTime);

      gain.gain.setValueAtTime(0.001, startTime);
      gain.gain.exponentialRampToValueAtTime(0.85, startTime + 0.02);
      gain.gain.setValueAtTime(0.85, startTime + duration - 0.05);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        startTime + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.02);
    }

    function playPhoneCountdownSound() {
      playPhoneBuzzer(180, 0.55, 1.0);
    }

    function playPhoneTimeUpSound() {
      playPhoneBuzzer(120, 1.6, 1.0);
    }

    function playPhoneBuzzer(frequency, duration, volume) {
      if (!audioContext) {
        return;
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(console.error);
      }

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;

      oscillator.type = "square";
      oscillator.frequency.setValueAtTime(frequency, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
      gain.gain.setValueAtTime(volume, now + duration - 0.08);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now);
      oscillator.stop(now + duration + 0.02);
    }

    function showReplayButton() {
      document.getElementById("replayBtn").style.display = "block";
    }

    function onReceive(event) {
      const dataView = event.target.value;
      const bytes = new Uint8Array(
        dataView.buffer,
        dataView.byteOffset,
        dataView.byteLength
      );

      const message = new TextDecoder().decode(bytes).trim();

      const alertBox = document.getElementById("alertBanner");
      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const sub = document.getElementById("subOutput");

      if (message.startsWith("MODE1:ABORT:")) {
        const playerLabel = message.substring("MODE1:ABORT:".length);
        const playerNumber = playerLabel.replace("P", "");

        alertBox.style.display = "block";
        alertBox.innerText =
          `プレイヤー${playerNumber}が手を離しました。`;
        sub.innerText = "フライングのためゲーム中止";
        playPhoneErrorSound();
        return;
      }

      if (message.startsWith("MODE1:")) {
        alertBox.style.display = "none";

        if (message === "MODE1:WAIT") {
          sub.innerText =
            "合図を待ってください。手を離すかボタンを押すとフライングです";
        } else if (message === "MODE1:GO") {
          sub.innerText = "合図！一番早くボタンを押してください";
        } else if (message.startsWith("MODE1:WIN:")) {
          const player = message.substring("MODE1:WIN:".length);
          alertBox.style.display = "block";
          alertBox.innerText = `${player} の勝ち！`;
          sub.innerText = "勝者以外にペナルティ";
        } else if (message === "MODE1:NONE") {
          alertBox.style.display = "block";
          alertBox.innerText = "時間切れ：勝者なし";
          sub.innerText = "今回のゲームは終了しました";
        }

        return;
      }

      if (message === "STATUS:WAIT_TOUCH") {
        sub.innerText = "全員、タッチセンサーに触れてください";
        return;
      }

      if (message === "STATUS:READY") {
        alertBox.style.display = "block";
        alertBox.innerText = "全員セット完了！";
        return;
      }

      if (message.startsWith("TIMELEFT:")) {
        const seconds = Number(message.substring("TIMELEFT:".length));

        timeValue.innerText = String(seconds);
        timeValue.classList.toggle("urgent", seconds <= 5);

        if (seconds === 0) {
          sub.innerText = "タイムアップ";
        } else {
          sub.innerText = "光ったボタンを押してください";
        }

        alertBox.style.display = "none";

        if (seconds >= 1 && seconds <= 5) {
          playPhoneCountdownSound();
        }

        return;
      }

      if (message.startsWith("SOLO_SCORE:")) {
        scoreValue.innerText = message.substring("SOLO_SCORE:".length);
        sub.innerText = "光ったボタンを押してください";
        alertBox.style.display = "none";
        return;
      }

      if (message.startsWith("COUNTDOWN:")) {
        const value = message.substring("COUNTDOWN:".length);

        if (value === "START") {
          sub.innerText = "スタート！ボタンを押してください";
        } else {
          sub.innerText = `ゲーム開始まで ${value}`;
        }

        return;
      }

      if (message.startsWith("ALERT:")) {
        alertBox.style.display = "block";
        alertBox.innerText = message.substring("ALERT:".length);

        if (message.includes("タイムアップ")) {
          playPhoneTimeUpSound();
        }

        return;
      }

      if (message === "STATUS:FINISHED") {
        sub.innerText = "ゲーム終了";
        showReplayButton();
      }
    }

    async function startSelectedGame() {
      preparePhoneAudio();

      document.getElementById("menuView").classList.remove("active");
      document.getElementById("gameView").classList.add("active");

      document.getElementById("alertBanner").style.display = "none";
      document.getElementById("replayBtn").style.display = "none";

      document.getElementById("modeTitle").innerText =
        `ゲームモード 0${activeMode}`;

      const scoreValue = document.getElementById("scoreValue");
      const timeValue = document.getElementById("timeValue");
      const sub = document.getElementById("subOutput");

      await sendData(`PLAYERS:${selectedPlayers}`);

      if (activeMode === 5) {
        scoreValue.innerText = "0";
        timeValue.innerText = "60";
        timeValue.classList.remove("urgent");
        sub.innerText = "カウントダウンを待っています";
      } else {
        scoreValue.innerText = "0";
        timeValue.innerText = "--";
        timeValue.classList.remove("urgent");
        sub.innerText = "全員、タッチセンサーに触れてください";
      }

      await sendData(`MODE:${activeMode}`);
    }

    async function launchGame() {
      await startSelectedGame();
    }

    async function replayGame() {
      await startSelectedGame();
    }

    async function returnMenu() {
      await sendData("MODE:0");

      document.getElementById("gameView").classList.remove("active");
      document.getElementById("menuView").classList.add("active");
    }
  </script>
</body>
</html>
